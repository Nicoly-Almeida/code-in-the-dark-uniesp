<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f0e9">
  <title>Cronômetro | Code in the Dark UNIESP</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f2f0e9;
      --ink: #171916;
      --muted: #65685f;
      --line: #c9c8bd;
      --signal: #e94d35;
      --ready: #c9ed56;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background-color: var(--paper);
      background-image: linear-gradient(rgba(23, 25, 22, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(23, 25, 22, .035) 1px, transparent 1px);
      background-size: 32px 32px;
      color: var(--ink);
      font-family: "Trebuchet MS", "Arial", sans-serif;
    }

    main {
      width: min(100% - 40px, 920px);
      padding: 28px 0 36px;
      text-align: center;
    }

    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .event-name { color: var(--ink); }

    .round-label {
      margin: 56px 0 8px;
      color: var(--signal);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.15;
    }

    .clock {
      margin: 20px 0 4px;
      font-family: "Courier New", monospace;
      font-size: 176px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    .status {
      min-height: 28px;
      margin: 10px 0 30px;
      color: var(--muted);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      min-height: 50px;
      padding: 0 20px;
      border: 1px solid var(--ink);
      border-radius: 2px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }
    button:hover { background: rgba(23, 25, 22, .07); }
    button.primary { background: var(--ready); }
    button.primary:hover { background: #b7dc3e; }

    .hint {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    body.running .round-label { color: var(--ink); }
    body.finished { background-color: #fbe1dc; }
    body.finished .round-label, body.finished .status { color: var(--signal); }

    @media (max-width: 600px) {
      main { width: min(100% - 28px, 920px); }
      .masthead { font-size: 11px; }
      .round-label { margin-top: 42px; font-size: 13px; }
      h1 { font-size: 26px; }
      .clock { margin-top: 26px; font-size: 88px; }
      .status { font-size: 14px; }
      button { flex: 1 1 40%; padding: 0 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <span class="event-name">Code in the Dark</span>
      <span>UNIESP</span>
    </header>
    <p class="round-label" id="label">Aguardando</p>
    <h1 id="title">Code in the Dark</h1>
    <div class="clock" id="clock" role="timer" aria-label="sem rodada">--:--</div>
    <p class="status" id="status" aria-live="polite">Conectando...</p>
    <div class="controls">
      <button id="fullscreen" type="button">Tela cheia</button>
    </div>
    <p class="hint">O tempo é controlado pelo painel da organização &nbsp;|&nbsp; F: tela cheia</p>
  </main>
  <script src="../citd-config.js"></script>
  <script>
    // Telão: acompanha a rodada atual no Supabase (play, pausa e fim vêm do painel).
    (function () {
      var POLL_MS = 1500;
      var cfg = window.CITD_CONFIG || {};
      var label = document.getElementById("label");
      var title = document.getElementById("title");
      var clock = document.getElementById("clock");
      var status = document.getElementById("status");
      var fullscreen = document.getElementById("fullscreen");
      var state = null;
      var offsetMs = 0;
      var offline = false;

      function rpc(name) {
        var key = cfg.supabasePublishableKey;
        return fetch(cfg.supabaseUrl + "/rest/v1/rpc/" + name, {
          method: "POST",
          cache: "no-store",
          headers: { apikey: key, Authorization: "Bearer " + key, "Content-Type": "application/json" },
          body: "{}",
        }).then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        });
      }

      function render() {
        var now = Date.now() + offsetMs;
        var phase = state ? state.status : null;
        var remaining = 0;
        if (phase === "valendo") {
          remaining = Math.max(0, Math.ceil((Date.parse(state.ends_at) - now) / 1000));
          if (remaining === 0) phase = "encerrada";
        } else if (phase === "pausada") {
          remaining = state.remaining_seconds;
        }

        var display = state
          ? String(Math.floor(remaining / 60)).padStart(2, "0") + ":" + String(remaining % 60).padStart(2, "0")
          : "--:--";
        clock.textContent = display;
        clock.setAttribute("aria-label", state ? display + " restantes" : "sem rodada");
        title.textContent = state ? state.title : "Code in the Dark";
        document.body.classList.toggle("running", phase === "valendo");
        document.body.classList.toggle("finished", phase === "encerrada");

        var text = {
          valendo: ["Rodada em andamento", "Competidores, podem começar"],
          pausada: ["Rodada pausada", "Rodada pausada"],
          encerrada: ["Rodada encerrada", "Tempo esgotado: parem de digitar"],
        }[phase] || ["Aguardando", "Aguardando a próxima rodada"];
        label.textContent = text[0];
        status.textContent = offline ? "Sem conexão: tentando de novo..." : text[1];
      }

      function poll() {
        var sentAt = Date.now();
        rpc("estado_atual").then(function (s) {
          if (s && s.server_now) offsetMs = Date.parse(s.server_now) - (sentAt + Date.now()) / 2;
          state = s;
          offline = false;
        }, function () {
          offline = true;
        }).then(function () {
          render();
          setTimeout(poll, POLL_MS);
        });
      }

      fullscreen.addEventListener("click", function () {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });
      document.addEventListener("keydown", function (event) {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key.toLowerCase() === "f") fullscreen.click();
      });
      document.addEventListener("fullscreenchange", function () {
        fullscreen.textContent = document.fullscreenElement ? "Sair da tela cheia" : "Tela cheia";
      });

      if (window.location.protocol === "file:" || !cfg.supabaseUrl || !cfg.supabasePublishableKey) {
        status.textContent = "Abra pelo endereço publicado do site para acompanhar a rodada.";
        return;
      }
      setInterval(render, 250);
      poll();
    })();
  </script>
</body>
</html>
